[project]
name = "frankfurter38cx2-bft"
version = "0.1.0"
description = "Frankfurter38cx2 board functional / diagnostic tests"
requires-python = ">=3.12"
dependencies = [
    "jc>=1.25.6",
    "loguru>=0.7.3",
    "pexpect>=4.9.0",
    "pytest>=8.0",
    "requests>=2.32.0",
    "typer>=0.12.0",
]

[project.scripts]
frankfurter-bft = "main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["bft*", "libs*", "test*"]
